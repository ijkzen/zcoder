name: zcode_remote
description: 用 Flutter 重写的 ZCode 远程控制客户端（替代 Web 远控页面）。
publish_to: 'none'
version: 0.5.1+31

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  path: ^1.9.1
  sqflite: ^2.4.3
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^22.3.0
  flutter_foreground_task: ^11.0.0
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.1
  image_picker: ^1.1.2
  file_picker: ^12.0.0
  wakelock_plus: ^1.7.0
  http: ^1.2.0
  path_provider: ^2.1.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
