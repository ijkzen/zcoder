name: 缺陷报告 / Bug report
description: 报告一个可复现的问题 / Report a reproducible issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交缺陷报告！请尽量提供完整信息，便于定位。UI 相关缺陷建议附截图。
        Thanks for reporting! Please fill in as much as possible; screenshots help for UI bugs.
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      description: 手机型号与系统版本、应用版本（0.4.1+8）、桌面端版本
      placeholder: |
        例如：Pixel 8 / Android 15 / 0.4.1+8 / ZCode 桌面 v0.5.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从哪一屏开始，逐步操作
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
      description: 你认为应该发生什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual behavior
      description: 实际发生了什么；附截图/录屏更有帮助
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 连接相关问题请附 adb logcat 或桌面端 ~/.zcode/v2/logs/ 的日志片段
      render: shell
