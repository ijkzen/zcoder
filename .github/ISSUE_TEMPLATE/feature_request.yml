name: 功能建议 / Feature request
description: 提出一个新功能或改进 / Suggest an idea for this project
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        描述你想要的改进，越具体越好。
        Describe the improvement you'd like, as concretely as possible.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你的使用场景是什么？现状哪里不顺手？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望的行为或界面是什么样的？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
      description: 你考虑过的其他做法（可选）
